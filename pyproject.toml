[project]
name = "achoose"
version = "0.1.0"
description = "A private personal assistant with a local brain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
memory = ["numpy>=1.26", "pypdf>=4.0", "python-docx>=1.1", "python-pptx>=1.0"]

[project.scripts]
achoose = "achoose.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["achoose*"]
