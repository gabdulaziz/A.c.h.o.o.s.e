# Achoose settings.
# Copy this file to ~/.config/achoose/config.toml and change what you need.
# Every line is optional; anything left out uses the default shown here.

# The local model Achoose thinks with (must be downloaded: ollama pull <name>)
model = "qwen3:4b-instruct-2507-q4_K_M"

# Where Ollama is running
ollama_host = "http://localhost:11434"

# How much text the model can see at once. Bigger = slower on a laptop.
context_tokens = 4096

# 0 = very predictable answers, 1 = more creative
temperature = 0.2

# Longest answer allowed, in tokens (~3/4 of a word). 400 is about a minute on a laptop.
max_answer_tokens = 400

# Some models have a slow "thinking" mode. Off keeps answers fast.
think = false

# Where Achoose keeps its own files (notes now, memory later)
data_dir = "~/Achoose"

# Folders Achoose may read without asking. Reading elsewhere is refused.
read_folders = ["~"]

# Folders Achoose indexes so it can search inside your files (type /index in the chat)
memory_folders = ["~/Documents", "~/Downloads"]

# Folder names to leave out of memory (wildcards allowed). Program installs
# (folders containing both bin/ and lib/) are always skipped.
memory_skip = []

# Gentle indexing for plain /index: processor threads to use, and a rest after each file.
# Cooler and quieter, about 2-3x slower. "/index fast" always uses every core.
index_threads = 2
index_pause_seconds = 0.5

# Small model that makes the "meaning fingerprints" for search (ollama pull embeddinggemma)
embed_model = "embeddinggemma"

# Voice mode (.venv/bin/python -m achoose --voice)
voice_name = "en_GB-alan-medium"   # Piper voice, a calm British male
voice_speed = 1.0                  # 1.2 = a bit faster, 0.9 = a bit slower
stt_model = "base.en"              # "small.en" understands better but is slower
stt_hints = true                   # give the speech model your app and folder names (helps with accents)
wake_word = "hey_jarvis"            # backup; trained files in ~/Achoose/wake_words/ are added automatically
wake_threshold = 0.5               # higher = fewer false wake-ups, but may miss you
call_user = "sir"                  # how Achoose addresses you; "" for nothing
input_device = ""                  # microphone number or name part, "" = default (see --voice-check)

# How many past messages Achoose remembers within one chat
history_messages = 20

# Safety limit on tool steps for a single question
max_tool_rounds = 5
